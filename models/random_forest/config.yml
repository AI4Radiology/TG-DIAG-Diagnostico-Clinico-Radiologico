name: random_forest
scaler: tfidf
oversampling: ros
tfidf_params:
  max_features: 200
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.9
  sublinear_tf: true
  stop_words: spanish_clinical
trainer:
  module: models.random_forest.model
  class: Trainer
hyperparameters:
  n_estimators: 100
  class_weight: balanced
  random_state: 42
validation_grid:
  scalers:
    - max_features: 200
      ngram_range: [1, 2]
      min_df: 3
      max_df: 0.9
      sublinear_tf: true
      stop_words: spanish_clinical
  model_params:
    - n_estimators: 100
    - n_estimators: 200
    - n_estimators: 300
