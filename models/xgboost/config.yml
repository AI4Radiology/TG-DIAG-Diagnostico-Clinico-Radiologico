name: xgboost
scaler: tfidf
auto_scale_pos_weight: true
tfidf_params:
  max_features: 200
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.9
  sublinear_tf: true
  stop_words: spanish_clinical
trainer:
  module: models.xgboost.model
  class: Trainer
hyperparameters:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  eval_metric: logloss
validation_grid:
  scalers:
    - max_features: 200
      ngram_range: [1, 2]
      min_df: 3
      max_df: 0.9
      sublinear_tf: true
      stop_words: spanish_clinical
  model_params:
    - n_estimators: 100
      max_depth: 4
    - n_estimators: 200
      max_depth: 6
    - n_estimators: 300
      max_depth: 8
